services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data"]
  ui:
    build: .
    command: streamlit run app/ui.py --server.address=0.0.0.0 --server.port=8501
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    volumes: ["./data:/app/data"]
